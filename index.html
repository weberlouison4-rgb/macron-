<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coucou — Macron maneki-neko (édition délire)</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0b14; }
    #ui {
      position: fixed; left: 12px; bottom: 12px; z-index: 10;
      color: #fff; font: 13px/1.5 system-ui, sans-serif;
      background: rgba(8, 10, 26, 0.6); backdrop-filter: blur(6px);
      padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15);
      user-select: none;
    }
    #ui button {
      font: inherit; color: #fff; background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25); border-radius: 7px;
      padding: 4px 10px; margin: 2px 6px 2px 0; cursor: pointer;
    }
    #ui button:hover { background: rgba(255,255,255,0.22); }
    #hint { opacity: 0.75; margin-top: 6px; }
    #title {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 10; color: #ffd75e; font: italic bold 28px Georgia, serif;
      text-shadow: 0 2px 14px rgba(0,0,0,0.8); pointer-events: none; letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="title">« Coucou ! » 🇫🇷</div>
  <div id="ui">
    <button id="btnWave">Coucou : normal</button>
    <button id="btnRotate">Rotation auto : non</button>
    <button id="btnCam">Caméra : face</button>
    <div id="hint">Glissez pour tourner — molette pour zoomer.</div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ============================================================ Constantes
    const COLORS = {
      skin: '#f2c79d', skinDark: '#dfae7e',
      hair: '#3c2a1c', brow: '#2d2014',
      suit: '#1b2b4f', suitDark: '#131f3c',
      shirt: '#f6f8fb', tie: '#1f5fc4',
      gold: '#e8c35a', navy: '#0d1733',
      flagBlue: '#2a49d8', flagRed: '#e0233c',
      mouth: '#a13648', iris: '#4a7ecc',
      shoe: '#15151a', stage: '#565a6e', dark: '#3a3d50',
      carpet: '#8e1f35', crowdFloor: '#1d2033',
    };
    const SKIN_TONES = ['#f2c79d', '#e8b489', '#d9a074', '#b97e52', '#8d5a35', '#f7d7b3'];
    const HAIR_TONES = ['#2b1c10', '#3c2a1c', '#584032', '#7a5a3a', '#93705a', '#1a1a1a', '#5a4632'];
    const SHIRT_TONES = ['#c23b4e', '#2a49d8', '#2e8b57', '#e8a13a', '#7a3fa0', '#f0f0f0', '#282838', '#d46a9e', '#3aa0b8', '#e07b39'];

    // ============================================================ Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#14162a');
    scene.fog = new THREE.Fog('#14162a', 16, 42);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);
    const CAM_VIEWS = [
      { name: 'face', pos: [0.8, 2.9, 7.4], target: [0, 2.4, 0] },
      { name: 'public', pos: [0, 1.4, 11.5], target: [0, 2.8, 0] },
      { name: 'plongée', pos: [-5.5, 6.5, 5.5], target: [0, 1.8, 0] },
      { name: 'côté', pos: [6.5, 2.2, 2.5], target: [0, 2.6, 0] },
    ];
    camera.position.set(...CAM_VIEWS[0].pos);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(...CAM_VIEWS[0].target);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 3;
    controls.maxDistance = 20;
    controls.maxPolarAngle = 1.5;
    controls.autoRotateSpeed = 0.6;

    // ============================================================ Lumières
    scene.add(new THREE.HemisphereLight('#9fb0ff', '#221a34', 0.5));
    const key = new THREE.DirectionalLight('#fff3e0', 1.5);
    key.position.set(5, 9, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -8; key.shadow.camera.right = 8;
    key.shadow.camera.top = 10;  key.shadow.camera.bottom = -4;
    key.shadow.camera.far = 32;
    scene.add(key);
    const fill = new THREE.DirectionalLight('#aebfff', 0.4);
    fill.position.set(-6, 4, 2);
    scene.add(fill);
    // projecteurs vers l'estrade
    function addSpot(x, z, color, intensity) {
      const s = new THREE.SpotLight(color, intensity, 30, 0.5, 0.5, 1.6);
      s.position.set(x, 8.5, z);
      s.target.position.set(0, 1.5, 0);
      scene.add(s, s.target);
      return s;
    }
    addSpot(-5, 5, '#ffe3b8', 90);
    addSpot(5, 4, '#cfe0ff', 70);
    // cônes de lumière (effet volumétrique)
    const coneMat = new THREE.MeshBasicMaterial({
      color: '#ffe9c0', transparent: true, opacity: 0.05,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    [[-5, 5], [5, 4]].forEach(([x, z]) => {
      const cone = new THREE.Mesh(new THREE.ConeGeometry(2.6, 8.5, 24, 1, true), coneMat);
      cone.position.set(x * 0.6, 4.5, z * 0.55);
      cone.lookAt(0, 0.5, 0);
      cone.rotateX(-Math.PI / 2);
      scene.add(cone);
    });

    // ============================================================ Textures
    function makeCanvas(w, h, draw) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      draw(c.getContext('2d'));
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 8;
      return t;
    }
    const flagTex = makeCanvas(768, 512, (ctx) => {
      ctx.fillStyle = COLORS.flagBlue; ctx.fillRect(0, 0, 256, 512);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(256, 0, 256, 512);
      ctx.fillStyle = COLORS.flagRed; ctx.fillRect(512, 0, 256, 512);
    });
    const rosetteTex = makeCanvas(256, 256, (ctx) => {
      const cols = [COLORS.flagBlue, '#ffffff', COLORS.flagRed];
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(128, 128);
        ctx.arc(128, 128, 118, (i * 2 - 1) * Math.PI / 3, ((i + 1) * 2 - 1) * Math.PI / 3);
        ctx.closePath(); ctx.fillStyle = cols[i]; ctx.fill();
      }
      ctx.beginPath(); ctx.arc(128, 128, 118, 0, 7);
      ctx.lineWidth = 14; ctx.strokeStyle = COLORS.gold; ctx.stroke();
    });
    const podiumTex = makeCanvas(1024, 680, (ctx) => {
      ctx.fillStyle = COLORS.navy; ctx.fillRect(0, 0, 1024, 680);
      const grad = ctx.createLinearGradient(0, 0, 0, 680);
      grad.addColorStop(0, 'rgba(255,255,255,0.10)'); grad.addColorStop(1, 'rgba(0,0,0,0.25)');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, 1024, 680);
      ctx.lineWidth = 22; ctx.strokeStyle = COLORS.gold;
      ctx.strokeRect(40, 40, 944, 600);
      ctx.fillStyle = COLORS.gold; ctx.textAlign = 'center';
      ctx.font = 'bold 118px Georgia, serif';
      ctx.fillText('RÉPUBLIQUE', 512, 268);
      ctx.fillText('FRANÇAISE', 512, 420);
      const cols = [COLORS.flagBlue, '#ffffff', COLORS.flagRed];
      cols.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(332 + i * 120, 480, 120, 34); });
    });
    const bannerTex = makeCanvas(1024, 256, (ctx) => {
      ctx.clearRect(0, 0, 1024, 256);
      ctx.beginPath(); ctx.roundRect(10, 24, 1004, 208, 26);
      ctx.fillStyle = '#fffdf4'; ctx.fill();
      ctx.lineWidth = 10; ctx.strokeStyle = COLORS.gold; ctx.stroke();
      ctx.fillStyle = COLORS.navy; ctx.textAlign = 'center';
      ctx.font = 'italic bold 128px Georgia, serif';
      ctx.fillText('COUCOU !', 512, 166);
    });

    // ============================================================ Matériaux
    const mat = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.62, ...opts });
    function addMesh(geo, material, parent, opts = {}) {
      const m = new THREE.Mesh(geo, material);
      if (opts.pos) m.position.set(...opts.pos);
      if (opts.rot) m.rotation.set(...opts.rot);
      if (opts.scale) m.scale.set(...opts.scale);
      m.castShadow = opts.cast !== false;
      m.receiveShadow = true;
      parent.add(m);
      return m;
    }

    // ============================================================ Sol + estrade
    const floor = new THREE.Mesh(new THREE.CircleGeometry(42, 56), mat(COLORS.crowdFloor, { roughness: 0.95 }));
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const stage = new THREE.Group();
    scene.add(stage);
    addMesh(new THREE.CylinderGeometry(3.4, 3.6, 0.62, 56), mat(COLORS.stage), stage, { pos: [0, 0.31, 0], cast: false });
    addMesh(new THREE.CylinderGeometry(3.1, 3.1, 0.26, 56), mat(COLORS.dark), stage, { pos: [0, 0.75, 0], cast: false });
    addMesh(new THREE.CylinderGeometry(3.05, 3.05, 0.05, 56), mat(COLORS.carpet, { roughness: 0.9 }), stage, { pos: [0, 0.885, 0], cast: false });
    addMesh(new THREE.TorusGeometry(3.07, 0.045, 12, 72), mat(COLORS.gold, { metalness: 0.7, roughness: 0.3 }), stage, { pos: [0, 0.89, 0], rot: [Math.PI / 2, 0, 0] });
    addMesh(new THREE.BoxGeometry(2.4, 0.2, 0.6), mat(COLORS.dark), stage, { pos: [0, 0.31, 3.65] });
    addMesh(new THREE.BoxGeometry(2.4, 0.2, 0.6), mat(COLORS.stage), stage, { pos: [0, 0.11, 4.25] });

    // ============================================================ Drapeaux animés
    function makeFlag(x, z, rotY) {
      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.rotation.y = rotY;
      addMesh(new THREE.CylinderGeometry(0.04, 0.05, 4.1, 12), mat('#8a8f9e', { metalness: 0.5, roughness: 0.4 }), g, { pos: [0, 2.05, 0] });
      addMesh(new THREE.SphereGeometry(0.1, 14, 10), mat(COLORS.gold, { metalness: 0.7, roughness: 0.3 }), g, { pos: [0, 4.1, 0] });
      const flagGeo = new THREE.PlaneGeometry(1.7, 1.1, 16, 8);
      const flag = new THREE.Mesh(flagGeo,
        new THREE.MeshStandardMaterial({ map: flagTex, side: THREE.DoubleSide, roughness: 0.85 }));
      flag.position.set(0.95, 3.4, 0);
      flag.castShadow = true;
      g.add(flag);
      const base = flagGeo.attributes.position.array.slice();
      scene.add(g);
      return { flag, base };
    }
    const flags = [makeFlag(-4.4, -0.6, 0.55), makeFlag(4.4, -0.6, -0.55)];

    // ============================================================ Pupitre
    const podium = new THREE.Group();
    podium.position.set(0, 0, 0.55);
    scene.add(podium);
    addMesh(new THREE.BoxGeometry(1.5, 1.0, 0.72), mat(COLORS.suit), podium, { pos: [0, 1.42, 0] });
    addMesh(new THREE.BoxGeometry(1.62, 0.09, 0.84), mat(COLORS.suitDark), podium, { pos: [0, 1.955, 0] });
    addMesh(new THREE.BoxGeometry(1.66, 0.045, 0.88), mat(COLORS.gold, { metalness: 0.7, roughness: 0.3 }), podium, { pos: [0, 1.915, 0] });
    addMesh(new THREE.PlaneGeometry(1.28, 0.85),
      new THREE.MeshStandardMaterial({ map: podiumTex, roughness: 0.55 }),
      podium, { pos: [0, 1.42, 0.3651], cast: false });
    // feuilles sur le pupitre
    addMesh(new THREE.BoxGeometry(0.3, 0.008, 0.4), mat('#f5f2e8', { roughness: 0.9 }), podium, { pos: [-0.4, 2.005, 0.1], rot: [0, 0.3, 0], cast: false });
    addMesh(new THREE.BoxGeometry(0.3, 0.008, 0.4), mat('#eeeae0', { roughness: 0.9 }), podium, { pos: [-0.36, 2.014, 0.14], rot: [0, 0.15, 0], cast: false });
    // micro
    const mic = new THREE.Group();
    mic.position.set(0.42, 2.0, 0.1);
    podium.add(mic);
    const micArm = addMesh(new THREE.CylinderGeometry(0.013, 0.013, 0.45, 8), mat('#555', { metalness: 0.5 }), mic, { rot: [0.5, 0, 0.35] });
    micArm.position.set(0, 0.21, 0.05);
    addMesh(new THREE.SphereGeometry(0.055, 14, 12), mat('#181818', { roughness: 0.35, metalness: 0.3 }), mic, { pos: [-0.08, 0.43, 0.09] });

    // ============================================================ Banderole
    const banner = new THREE.Mesh(
      new THREE.PlaneGeometry(3.6, 0.9),
      new THREE.MeshStandardMaterial({ map: bannerTex, transparent: true, roughness: 0.7, side: THREE.DoubleSide })
    );
    banner.position.set(0, 3.9, -2.4);
    banner.rotation.x = -0.06;
    scene.add(banner);

    // ============================================================ Macron
    const character = new THREE.Group();
    character.position.set(0, 0.91, -0.15);
    scene.add(character);
    const skinMat = mat(COLORS.skin, { roughness: 0.55 });

    // jambes
    [-0.13, 0.13].forEach((x) => {
      addMesh(new THREE.CylinderGeometry(0.085, 0.1, 0.56, 14), mat(COLORS.suitDark), character, { pos: [x, 0.28, 0.02] });
      addMesh(new THREE.BoxGeometry(0.17, 0.085, 0.3), mat(COLORS.shoe, { roughness: 0.3 }), character, { pos: [x, 0.042, 0.08] });
    });

    const torso = new THREE.Group();
    torso.position.y = 0.56;
    character.add(torso);
    addMesh(new THREE.CylinderGeometry(0.21, 0.17, 0.6, 20), mat(COLORS.suit), torso, { pos: [0, 0.3, 0], scale: [1, 1, 0.78] });
    addMesh(new THREE.CylinderGeometry(0.075, 0.11, 0.3, 12), mat(COLORS.shirt, { roughness: 0.5 }), torso, { pos: [0, 0.42, 0.135], scale: [1, 1, 0.35] });
    addMesh(new THREE.ConeGeometry(0.105, 0.16, 12), mat(COLORS.suit), torso, { pos: [0, 0.5, 0.125], scale: [1, 1, 0.25], rot: [Math.PI, 0, 0] });
    [-1, 1].forEach((s) => {
      addMesh(new THREE.BoxGeometry(0.055, 0.26, 0.03), mat(COLORS.suitDark), torso, { pos: [s * 0.128, 0.475, 0.155], rot: [0, -s * 0.25, s * 0.22] });
      addMesh(new THREE.SphereGeometry(0.018, 10, 8), mat(COLORS.gold, { metalness: 0.7, roughness: 0.3 }), torso, { pos: [s * 0.216, 0.22, 0.145] });
    });
    // pochette
    addMesh(new THREE.BoxGeometry(0.06, 0.05, 0.012), mat('#ffffff', { roughness: 0.4 }), torso, { pos: [0.135, 0.52, 0.17], rot: [0, 0.2, 0.15] });
    // cravate
    const tie = new THREE.Group();
    tie.position.set(0, 0.5, 0.16);
    torso.add(tie);
    addMesh(new THREE.BoxGeometry(0.075, 0.09, 0.022), mat(COLORS.tie, { roughness: 0.4 }), tie, { pos: [0, -0.02, 0.01], rot: [0.15, 0, 0] });
    addMesh(new THREE.ConeGeometry(0.05, 0.26, 10), mat(COLORS.tie, { roughness: 0.4 }), tie, { pos: [0, -0.2, 0.035], rot: [0.18, Math.PI, 0] });
    // rosette
    const rosette = addMesh(new THREE.CylinderGeometry(0.052, 0.052, 0.012, 24),
      new THREE.MeshStandardMaterial({ map: rosetteTex, roughness: 0.5 }),
      torso, { pos: [-0.135, 0.5, 0.165], rot: [Math.PI / 2, 0, 0] });
    addMesh(new THREE.SphereGeometry(0.05, 10, 8), mat('#c9a03a', { metalness: 0.6, roughness: 0.35 }), rosette, { pos: [0, -0.09, 0] });

    // ---- bras
    function makeArm(side) {
      const shoulder = new THREE.Group();
      shoulder.position.set(side * 0.235, 0.545, 0.05);
      torso.add(shoulder);
      addMesh(new THREE.SphereGeometry(0.075, 14, 12), mat(COLORS.suit), shoulder, { pos: [0, 0.02, 0] });
      addMesh(new THREE.CylinderGeometry(0.055, 0.05, 0.36, 12), mat(COLORS.suit), shoulder, { pos: [0, -0.19, 0] });
      const elbow = new THREE.Group();
      elbow.position.set(0, -0.37, 0);
      shoulder.add(elbow);
      addMesh(new THREE.SphereGeometry(0.056, 12, 10), mat(COLORS.suit), elbow, { pos: [0, 0, 0] });
      addMesh(new THREE.CylinderGeometry(0.048, 0.045, 0.3, 12), mat(COLORS.suit), elbow, { pos: [0, -0.16, 0] });
      addMesh(new THREE.CylinderGeometry(0.05, 0.05, 0.05, 12), mat(COLORS.shirt, { roughness: 0.5 }), elbow, { pos: [0, -0.3, 0] });
      const hand = new THREE.Group();
      hand.position.set(0, -0.35, 0);
      elbow.add(hand);
      addMesh(new THREE.SphereGeometry(0.062, 14, 12), skinMat, hand, { scale: [1.15, 0.75, 0.55] });
      if (side > 0) {
        for (let i = 0; i < 4; i++) {
          addMesh(new THREE.CapsuleGeometry(0.013, 0.035, 4, 8), skinMat, hand,
            { pos: [-0.075 + i * 0.05, 0.055, 0.01], rot: [0.3, 0, 0.1] });
        }
        addMesh(new THREE.CapsuleGeometry(0.012, 0.03, 4, 8), skinMat, hand, { pos: [0.088, 0.005, 0.01], rot: [0, 0, -0.9] });
      }
      return { shoulder, elbow, hand };
    }
    const waveArm = makeArm(+1);
    const restArm = makeArm(-1);

    // ---- tête
    const neck = new THREE.Group();
    neck.position.set(0, 0.62, 0);
    torso.add(neck);
    addMesh(new THREE.CylinderGeometry(0.065, 0.075, 0.14, 14), skinMat, neck, { pos: [0, 0.05, 0] });
    const head = new THREE.Group();
    head.position.set(0, 0.16, 0);
    neck.add(head);

    addMesh(new THREE.SphereGeometry(0.3, 32, 24), skinMat, head, { pos: [0, 0.07, 0], scale: [0.9, 1.04, 0.94] });
    // cheveux
    addMesh(new THREE.SphereGeometry(0.305, 28, 18, 0, Math.PI * 2, 0, Math.PI * 0.52),
      mat(COLORS.hair, { roughness: 0.85 }), head, { pos: [0, 0.085, -0.01], rot: [-0.12, 0, -0.1], scale: [1.02, 1.0, 1.02] });
    addMesh(new THREE.TorusGeometry(0.13, 0.05, 10, 22, Math.PI * 1.05),
      mat(COLORS.hair, { roughness: 0.85 }), head, { pos: [0.07, 0.345, 0.1], rot: [1.35, 0.15, -0.5] });
    [-1, 1].forEach((s) => {
      addMesh(new THREE.SphereGeometry(0.055, 12, 10), mat(COLORS.hair, { roughness: 0.85 }), head, { pos: [s * 0.24, 0.06, 0], scale: [0.45, 1.1, 0.85] });
    });
    // oreilles
    [-1, 1].forEach((s) => {
      addMesh(new THREE.SphereGeometry(0.05, 12, 10), skinMat, head, { pos: [s * 0.265, 0.05, 0.01], scale: [0.5, 1, 0.8] });
    });
    // sourcils
    [-1, 1].forEach((s) => {
      addMesh(new THREE.BoxGeometry(0.115, 0.02, 0.024), mat(COLORS.brow), head, { pos: [s * 0.105, 0.155, 0.275], rot: [0, -s * 0.12, s * 0.16] });
    });
    // yeux + paupières
    const eyes = new THREE.Group();
    head.add(eyes);
    const eyelids = [];
    [-0.1, 0.1].forEach((x) => {
      const eye = new THREE.Group();
      eye.position.set(x, 0.075, 0.262);
      eyes.add(eye);
      addMesh(new THREE.SphereGeometry(0.05, 16, 12), mat('#ffffff', { roughness: 0.25 }), eye, { scale: [1, 0.88, 0.62] });
      addMesh(new THREE.SphereGeometry(0.024, 12, 10), mat(COLORS.iris, { roughness: 0.3 }), eye, { pos: [0, 0, 0.031] });
      addMesh(new THREE.SphereGeometry(0.012, 10, 8), mat('#101010', { roughness: 0.2 }), eye, { pos: [0, 0, 0.045] });
      addMesh(new THREE.SphereGeometry(0.006, 8, 6), mat('#ffffff', { roughness: 0.1 }), eye, { pos: [0.012, 0.015, 0.05] });
      const lid = addMesh(new THREE.SphereGeometry(0.052, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.5),
        skinMat, eye, { pos: [0, 0.012, 0.004], scale: [1.02, 0.06, 0.68] });
      eyelids.push(lid);
    });
    // nez
    addMesh(new THREE.SphereGeometry(0.043, 14, 12), mat(COLORS.skinDark), head,
      { pos: [0, -0.005, 0.27], scale: [0.72, 1.25, 0.95] });
    // sourire + dents
    const smile = addMesh(new THREE.TorusGeometry(0.078, 0.016, 10, 24, Math.PI),
      mat(COLORS.mouth, { roughness: 0.5 }), head, { pos: [0, -0.115, 0.235], rot: [0.08, 0, Math.PI] });
    addMesh(new THREE.SphereGeometry(0.03, 10, 8), mat(COLORS.mouth), head, { pos: [-0.078, -0.117, 0.235] });
    addMesh(new THREE.SphereGeometry(0.03, 10, 8), mat(COLORS.mouth), head, { pos: [0.078, -0.117, 0.235] });
    addMesh(new THREE.BoxGeometry(0.09, 0.022, 0.02), mat('#ffffff', { roughness: 0.25 }), head, { pos: [0, -0.122, 0.242] });
    // menton
    addMesh(new THREE.SphereGeometry(0.05, 12, 10), skinMat, head, { pos: [0, -0.19, 0.21], scale: [1.1, 0.7, 0.8] });

    // ============================================================ Le public
    const crowd = [];
    const N_PEOPLE = 140;
    const bodyGeos = {
      body: new THREE.CylinderGeometry(0.13, 0.16, 0.42, 10),
      head: new THREE.SphereGeometry(0.11, 12, 10),
      hair: new THREE.SphereGeometry(0.115, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.55),
      arm: new THREE.CapsuleGeometry(0.028, 0.16, 4, 6),
      leg: new THREE.CylinderGeometry(0.05, 0.06, 0.32, 8),
      pole: new THREE.CylinderGeometry(0.008, 0.008, 0.22, 6),
      flag: new THREE.PlaneGeometry(0.14, 0.09),
      phone: new THREE.BoxGeometry(0.06, 0.1, 0.008),
    };
    const flagTinyMat = new THREE.MeshStandardMaterial({ map: flagTex, side: THREE.DoubleSide, roughness: 0.9 });
    const phoneMat = new THREE.MeshStandardMaterial({ color: '#cfe6ff', emissive: '#9fc8ff', emissiveIntensity: 0.9, roughness: 0.3 });

    function rand(a, b) { return a + Math.random() * (b - a); }

    for (let i = 0; i < N_PEOPLE; i++) {
      // répartition en arc face à l'estrade (l'estrade face vers +z)
      const row = Math.floor(i / 20);
      const t = (i % 20) / 19;
      const angle = -0.95 + t * 1.9 + rand(-0.03, 0.03);      // radians autour de l'axe +z
      const radius = 5.2 + row * 0.95 + rand(-0.2, 0.2);
      const x = Math.sin(angle) * radius;
      const z = Math.cos(angle) * radius + 1.2;
      if (z < 3.2) continue;

      const g = new THREE.Group();
      g.position.set(x, 0, z);
      g.rotation.y = Math.atan2(-x, -(z - 1.2));
      const s = rand(0.82, 1.18);
      g.scale.setScalar(s);

      const skin = mat(SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)], { roughness: 0.6 });
      const shirt = mat(SHIRT_TONES[Math.floor(Math.random() * SHIRT_TONES.length)], { roughness: 0.75 });
      const hairCol = mat(HAIR_TONES[Math.floor(Math.random() * HAIR_TONES.length)], { roughness: 0.85 });
      const pantsCol = mat(['#22242e', '#31343f', '#4a3a2a', '#3a3f52'][Math.floor(Math.random() * 4)], { roughness: 0.85 });

      const person = { group: g, jumpPhase: rand(0, Math.PI * 2), jumpSpeed: rand(3.4, 6.2), jumpH: rand(0.05, 0.16), arms: [], hasFlag: false, wave: rand(0, 6.28) };

      // jambes
      [-0.06, 0.06].forEach((lx) => {
        addMesh(bodyGeos.leg, pantsCol, g, { pos: [lx, 0.16, 0], cast: false });
      });
      // torse
      addMesh(bodyGeos.body, shirt, g, { pos: [0, 0.53, 0], cast: false });
      // tête
      addMesh(bodyGeos.head, skin, g, { pos: [0, 0.85, 0], cast: false });
      addMesh(bodyGeos.hair, hairCol, g, { pos: [0, 0.86, 0], cast: false });
      // bras levés (en délire !)
      [-1, 1].forEach((sd) => {
        const armPivot = new THREE.Group();
        armPivot.position.set(sd * 0.14, 0.68, 0);
        g.add(armPivot);
        const arm = addMesh(bodyGeos.arm, shirt, armPivot, { pos: [0, 0.1, 0], cast: false });
        arm.rotation.z = sd * Math.PI;   // capsule pointe vers le haut
        person.arms.push(armPivot);
      });
      // certains brandissent un drapeau, d'autres un téléphone
      const r = Math.random();
      if (r < 0.22) {
        const fp = new THREE.Group();
        fp.position.set(0.14, 0.85, 0);
        g.add(fp);
        addMesh(bodyGeos.pole, mat('#777', { roughness: 0.5 }), fp, { pos: [0, 0.08, 0], cast: false });
        const fl = addMesh(bodyGeos.flag, flagTinyMat, fp, { pos: [0.075, 0.2, 0], cast: false });
        person.hasFlag = true;
        person.flagPivot = fp;
      } else if (r < 0.42) {
        const ph = new THREE.Group();
        ph.position.set(-0.14, 0.88, 0.03);
        g.add(ph);
        addMesh(bodyGeos.phone, phoneMat, ph, { rot: [0.2, 0, -0.2], cast: false });
      }
      scene.add(g);
      crowd.push(person);
    }

    // ============================================================ Flashs de caméras
    const flashes = [];
    const flashMat = new THREE.SpriteMaterial({
      color: '#ffffff', transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    for (let i = 0; i < 22; i++) {
      const sp = new THREE.Sprite(flashMat.clone());
      const ang = rand(-0.9, 0.9);
      const rad = rand(5.5, 9.5);
      sp.position.set(Math.sin(ang) * rad, rand(0.8, 1.8), Math.cos(ang) * rad + 1.4);
      sp.scale.setScalar(rand(0.5, 1.1));
      scene.add(sp);
      flashes.push({ sp, next: rand(0, 3), dur: 0 });
    }

    // ============================================================ Confettis
    const CONF_N = 1600;
    const confCols = [
      new THREE.Color(COLORS.flagBlue), new THREE.Color('#f5b81c'),
      new THREE.Color(COLORS.flagRed), new THREE.Color('#ffffff'),
      new THREE.Color('#7ec8ff'),
    ];
    const cGeo = new THREE.BufferGeometry();
    const cPos = new Float32Array(CONF_N * 3);
    const cCol = new Float32Array(CONF_N * 3);
    const cSpeed = new Float32Array(CONF_N);
    for (let i = 0; i < CONF_N; i++) {
      cPos[i * 3] = rand(-8, 8);
      cPos[i * 3 + 1] = rand(0.5, 10);
      cPos[i * 3 + 2] = rand(-4, 8);
      const c = confCols[i % confCols.length];
      cCol[i * 3] = c.r; cCol[i * 3 + 1] = c.g; cCol[i * 3 + 2] = c.b;
      cSpeed[i] = rand(0.5, 1.5);
    }
    cGeo.setAttribute('position', new THREE.BufferAttribute(cPos, 3));
    cGeo.setAttribute('color', new THREE.BufferAttribute(cCol, 3));
    const confetti = new THREE.Points(cGeo,
      new THREE.PointsMaterial({ size: 0.07, vertexColors: true, transparent: true, opacity: 0.95 }));
    scene.add(confetti);

    // ============================================================ UI
    let waveSpeed = 1, camView = 0;
    document.getElementById('btnWave').addEventListener('click', (e) => {
      waveSpeed = waveSpeed === 1 ? 1.8 : (waveSpeed === 1.8 ? 0.45 : 1);
      e.target.textContent = `Coucou : ${waveSpeed === 1.8 ? 'rapide' : waveSpeed === 0.45 ? 'paresseux' : 'normal'}`;
    });
    document.getElementById('btnRotate').addEventListener('click', (e) => {
      controls.autoRotate = !controls.autoRotate;
      e.target.textContent = `Rotation auto : ${controls.autoRotate ? 'oui' : 'non'}`;
    });
    document.getElementById('btnCam').addEventListener('click', (e) => {
      camView = (camView + 1) % CAM_VIEWS.length;
      const v = CAM_VIEWS[camView];
      camera.position.set(...v.pos);
      controls.target.set(...v.target);
      e.target.textContent = `Caméra : ${v.name}`;
    });
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ============================================================ Animation
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      const w = t * 4.6 * waveSpeed;

      // — Macron : coucou maneki-neko
      waveArm.shoulder.rotation.z = 2.32 + Math.sin(w) * 0.06;
      waveArm.shoulder.rotation.x = -0.25;
      waveArm.elbow.rotation.z = -0.62 + Math.sin(w) * 0.5;
      waveArm.hand.rotation.z = 0.35 + Math.sin(w + 0.4) * 0.35;
      restArm.shoulder.rotation.z = -0.16 + Math.sin(t * 1.2) * 0.04;
      restArm.shoulder.rotation.x = -0.12 + Math.sin(t * 1.4) * 0.05;
      restArm.elbow.rotation.z = -0.4;
      head.rotation.y = Math.sin(t * 0.85) * 0.12;
      head.rotation.x = 0.045 * Math.sin(t * 0.7) + 0.02;
      head.rotation.z = 0.045 * Math.sin(w);
      head.position.y = 0.16 + 0.012 * Math.abs(Math.sin(w));
      character.position.y = 0.91 + 0.02 * Math.abs(Math.sin(w));
      torso.rotation.z = 0.025 * Math.sin(w);
      mic.rotation.x = 0.03 * Math.sin(t * 2.1);
      smile.scale.setScalar(1 + 0.07 * Math.max(0, Math.sin(w)));

      // clignement
      const bt = t % 3.4;
      const blink = bt > 3.18 ? Math.abs(Math.cos(((bt - 3.18) / 0.22) * Math.PI)) : 1;
      eyelids.forEach((lid) => { lid.scale.y = 0.06 + (1 - blink) * 0.9; });

      // — drapeaux ondulants (déplacement de sommets)
      flags.forEach(({ flag, base }, fi) => {
        const pos = flag.geometry.attributes.position;
        const arr = pos.array;
        for (let i = 0; i < arr.length; i += 3) {
          const bx = base[i], by = base[i + 1];
          arr[i + 2] = Math.sin(bx * 3.2 - t * 3 + fi) * 0.08 * (bx + 0.85);
          arr[i + 1] = by + Math.sin(bx * 2.5 - t * 2.4 + fi) * 0.015;
        }
        pos.needsUpdate = true;
        if (!flag.geometry.attributes.normal) return;
        flag.geometry.computeVertexNormals();
      });

      banner.position.y = 3.9 + 0.05 * Math.sin(t * 1.1);
      banner.rotation.z = 0.015 * Math.sin(t * 0.9);

      // — le public saute en délire
      for (const p of crowd) {
        const jump = Math.abs(Math.sin(t * p.jumpSpeed + p.jumpPhase));
        p.group.position.y = jump * p.jumpH;
        const flail = Math.sin(t * p.jumpSpeed * 1.1 + p.wave);
        p.arms[0].rotation.z = 0.5 + flail * 0.45;
        p.arms[1].rotation.z = -0.5 - flail * 0.45;
        if (p.hasFlag) p.flagPivot.rotation.z = flail * 0.35;
      }

      // — flashs de caméras
      for (const f of flashes) {
        f.next -= dt;
        if (f.next <= 0 && f.dur === 0) { f.dur = 0.14; f.next = rand(0.6, 4.5); }
        if (f.dur > 0) {
          f.dur -= dt;
          f.sp.material.opacity = Math.max(0, f.dur / 0.14) * 0.95;
        } else {
          f.sp.material.opacity = 0;
        }
      }

      // — confettis
      const posA = confetti.geometry.attributes.position;
      for (let i = 0; i < CONF_N; i++) {
        let y = posA.getY(i) - cSpeed[i] * dt;
        let x = posA.getX(i) + Math.sin(t * 1.6 + i) * dt * 0.3;
        if (y < 0.1) { y = rand(8, 11); x = rand(-8, 8); }
        posA.setY(i, y); posA.setX(i, x);
      }
      posA.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
